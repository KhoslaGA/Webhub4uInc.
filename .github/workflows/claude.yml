name: Claude Code

# Mention @claude in an issue, PR comment or review and Claude will analyse
# the code, make changes on a branch and push commits. It is not given merge
# or approval tools; a person reviews and merges every change. That rule is
# only ENFORCED once the main ruleset (.github/rulesets/main.json, imported
# in Settings → Rules) requires pull requests and the "build" check; this
# file does not enforce it.
#
# Setup (one time):
#   1. Install the Claude GitHub App on this repo (Claude Code CLI:
#      /install-github-app). Its token makes Claude's commits trigger CI —
#      commits pushed with the default GITHUB_TOKEN do not.
#   2. Add ONE repo secret: ANTHROPIC_API_KEY (API billing) or
#      CLAUDE_CODE_OAUTH_TOKEN (Claude subscription — swap the input below).
#
# Guardrails (from Anthropic's security docs — keep them):
#   - Only users with write access can trigger it (the default). Do NOT set
#     allowed_non_write_users, and never set allowed_bots: '*'.
#   - Treat issue/PR text from clients or outsiders as untrusted input
#     (prompt injection). Never give this workflow deploy or publish secrets.
#   - Every run is capped: --max-turns, a job timeout, one run per thread.
#   - The action is pinned to a full commit SHA, not a moving tag.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets Claude read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Project rules come from CLAUDE.md at the repo root.
          # Shell access is limited to installing and building — enough to
          # verify its own changes, nothing that deploys.
          claude_args: |
            --max-turns 15
            --allowedTools "Bash(npm ci),Bash(npm install),Bash(npm run build),Bash(git status),Bash(git diff:*),Bash(git log:*)"
