name: CI

# The merge gate for main. Every change — yours or Claude's — must build
# cleanly before it can merge. Make the "build" job a required status check:
#   Settings → Rules/Branches → main → Require status checks → "build".
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      # npm ci is strict: it fails if package-lock.json drifts from
      # package.json. Commit lockfile changes from `npm install`.
      - run: npm ci --no-audit --no-fund

      # next build also runs lint + type checks.
      - run: npm run build
